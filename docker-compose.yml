services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: ner-postgres
    env_file: ./backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ner-backend
    env_file: ./backend/.env
    environment:
      # Docker-specific overrides (db hostname, /app paths)
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-violent_events}
      - MODEL_PATH=/app/models/active
      - TRAIN_DATA_PATH=/app/data/processed/train.json
      - VAL_DATA_PATH=/app/data/processed/val.json
      - MODELS_OUTPUT_DIR=/app/models
    volumes:
      - ./backend/models:/app/models:rw
      - ./data:/app/data:rw
      - ./backend/console:/app/console:rw
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend (Nginx serving React app)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ner-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
